health:
  handler: src/index.handler
  events:
    - httpApi:
        path: /health
        method: get

createPurchaseRequest:
  handler: src/adapters/handlers/create-purchase-request.handler
  events:
    - httpApi:
        path: /purchase-requests
        method: post

getPurchaseRequest:
  handler: src/adapters/handlers/get-purchase-request.handler
  events:
    - httpApi:
        path: /purchase-requests/{id}
        method: get

listPurchaseRequests:
  handler: src/adapters/handlers/list-purchase-requests.handler
  events:
    - httpApi:
        path: /purchase-requests
        method: get
  name: purchase-approval-system-dev-listPurchaseRequests

updatePurchaseRequestStatus:
  handler: src/adapters/handlers/update-purchase-request-status.handler
  events:
    - httpApi:
        path: /purchase-requests/{id}/status
        method: patch
  name: purchase-approval-system-dev-updatePurchaseRequestStatus

createApproval:
  handler: src/adapters/handlers/create-approval.handler
  events:
    - httpApi:
        path: /purchase-requests/{id}/approvals
        method: post
  name: purchase-approval-system-dev-createApproval

listApprovals:
  handler: src/adapters/handlers/list-approvals.handler
  events:
    - httpApi:
        path: /purchase-requests/{id}/approvals
        method: get
  name: purchase-approval-system-dev-listApprovals

updateApprovalStatus:
  handler: src/adapters/handlers/update-approval-status.handler
  events:
    - httpApi:
        path: /approvals/{id}
        method: patch
  name: purchase-approval-system-dev-updateApprovalStatus

generateApprovalOtp:
  handler: src/adapters/handlers/generate-approval-otp.handler
  events:
    - httpApi:
        path: /approvals/{token}/otp
        method: get

validateApprovalOtp:
  handler: src/adapters/handlers/validate-approval-otp.handler
  events:
    - httpApi:
        path: /approvals/{token}/validate-otp
        method: post

mockMail:
  handler: src/adapters/handlers/mock-mail.handler
  events:
    - httpApi:
        path: /mock-mail
        method: get

downloadEvidence:
  handler: src/adapters/handlers/download-evidence.handler
  events:
    - httpApi:
        path: /api/solicitudes/{id}/evidencia.pdf
        method: get
