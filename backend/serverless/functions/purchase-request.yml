createPurchaseRequest:
  handler: src/adapters/handlers/create-purchase-request.handler
  events:
    - httpApi:
        path: /purchase-requests
        method: post

getPurchaseRequest:
  handler: src/adapters/handlers/get-purchase-request.handler
  events:
    - httpApi:
        path: /purchase-requests/{id}
        method: get
  name: purchase-approval-system-${self:provider.stage}-getPurchaseRequest
